name: Release Obsidian Plugin

on:
  push:
    branches: [main, beta]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release variant
        working-directory: apps/obsidian-plugin
        run: pnpm run build:${{ github.ref_name == 'beta' && 'beta' || 'main' }}

      - name: Release
        working-directory: apps/obsidian-plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Commit manifest.json
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- apps/obsidian-plugin/manifest.json; then
            echo "manifest.json unchanged; skipping commit"
            exit 0
          fi
          git add apps/obsidian-plugin/manifest.json
          git commit -m "chore: sync manifest version [skip ci]"
          git push

      - name: Generate artifact attestation
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/obsidian-plugin/build/main.js
            apps/obsidian-plugin/build/styles.css
