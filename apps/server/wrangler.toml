name = "thoth-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultDurableObject"]

[build]
command = "pnpm build"

[env.development]
name = "thoth-server-dev"

[env.production]
name = "thoth-server-prod"

[vars]
VERSION = "0.1.0"

[[durable_objects.bindings]]
name = "VAULT_DO"
class_name = "VaultDurableObject"
